services:

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/d135-1r43/pruefstein-web:latest
    restart: unless-stopped
    # No host port published: the app trusts X-Forwarded-* (see
    # quarkus.http.proxy.* in application.properties), so it must only ever be
    # reachable through Traefik, never directly.
    networks:
      - proxy
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.pruefstein.rule: Host(`${PRUEFSTEIN_HOST:-pruefstein.example.com}`)
      traefik.http.routers.pruefstein.entrypoints: websecure
      traefik.http.routers.pruefstein.tls: "true"
      traefik.http.routers.pruefstein.tls.certresolver: le
      traefik.http.services.pruefstein.loadbalancer.server.port: "8080"
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      PRUEFSTEIN_SECURITY_ROLE_CLAIM_PATH: ${PRUEFSTEIN_SECURITY_ROLE_CLAIM_PATH:-roles}
      PRUEFSTEIN_SECURITY_ADMIN_ROLE: ${PRUEFSTEIN_SECURITY_ADMIN_ROLE:-admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PRUEFSTEIN_BASE_URL: ${PRUEFSTEIN_BASE_URL}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Shared ingress network owned by the Traefik stack.
  proxy:
    external: true
  default:

volumes:
  postgres_data:
