## Builds the agent as a native binary for each Mac architecture and attaches
## the archives to a release, so a Homebrew formula has something with a stable
## URL and a checksum to point at.
##
## Kept out of ci.yml on purpose: a native build per architecture costs far
## more than a pull request should have to wait for, and nothing here needs to
## run on every push.

name: Agent release

on:
  push:
    tags: ['v*']
  ## Cutting an archive without cutting a release — useful for trying a
  ## formula against a real binary before there is a version to name.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          ## Apple silicon and Intel. The agent checks Macs and shells out to
          ## osquery, so these are the two platforms a tap actually needs;
          ## cross-compiling native images is not a thing, hence one runner
          ## per architecture.
          - runner: macos-latest
            arch: arm64
          - runner: macos-13
            arch: amd64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven

      - name: Build and package
        working-directory: agent
        run: ./bin/package.sh --build

      ## A binary nobody has run is not a release artifact. This is the
      ## cheapest proof that the thing in the archive starts at all — it is
      ## the unpacked copy that gets asked, not the build output.
      - name: Check the archive runs
        working-directory: agent
        run: |
          set -eux
          archive="$(find dist -name '*.tar.gz' | head -n1)"
          test -n "$archive"
          tar -xzf "$archive" -C dist
          unpacked="$(find dist -maxdepth 2 -type f -name pruefstein-agent -perm -u+x | head -n1)"
          test -n "$unpacked"
          "$unpacked" --help
          "$unpacked" login --help | grep -q -- --server

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: pruefstein-agent-darwin-${{ matrix.arch }}
          path: |
            agent/dist/*.tar.gz
            agent/dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      ## gh is already on the runner, so the release needs no third-party
      ## action. Re-running a tag tops the same release up rather than failing
      ## on one that already exists.
      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ## Nothing is checked out in this job, so gh has no git remote to
          ## infer the repository from.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          ls -l dist
          test -n "$(find dist -name '*.tar.gz' -print -quit)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
              --verify-tag --generate-notes
          fi
