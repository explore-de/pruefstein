{!
  A command to type into Terminal, with a button that copies it. Copies the
  rendered text rather than a JS string literal, so no quoting of the command
  can break out of the attribute.

  {#command step.command /}
  {#command runCommand spacing="mt-3 sm:mt-0" /}
!}
<div class="{spacing ?: 'mt-3'} flex items-center bg-stone-100 border-2 border-black"
     x-data="{ copied: false }">
  <pre class="flex-1 min-w-0 p-3 overflow-x-auto"><code x-ref="code" class="text-sm font-bold">{it}</code></pre>
  <button type="button"
          class="flex-shrink-0 p-2 mr-1 text-stone-400 hover:text-black transition-colors"
          @click="navigator.clipboard.writeText($refs.code.textContent).then(() => { copied = true; setTimeout(() => copied = false, 1500) })"
          :aria-label="copied ? 'Copied' : 'Copy command'" aria-label="Copy command" title="Copy">
    <svg x-show="!copied" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75"/>
    </svg>
    <svg x-show="copied" x-cloak class="w-4 h-4 text-black" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
    </svg>
  </button>
</div>
