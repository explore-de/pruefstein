quarkus.rest-csrf.require-form-url-encoded=false
quarkus.jackson.write-dates-as-timestamps=false
# Generated from this text rather than committed as art: quarkus-banner draws
# it at build time, so the banner is a line of configuration and not six lines
# of characters nobody can edit. `big` is the FIGlet font the checked-in
# banner.txt was made with, so it reads exactly as it did before.
quarkus.banner-generator.text=PRUEFSTEIN
quarkus.banner-generator.font=big

# ── OIDC: role-claim-path (Keycloak: realm_access/roles, Entra: roles) ──
pruefstein.security.role-claim-path=realm_access/roles

# ── OIDC: default tenant — web browser login (code flow) ───────────────
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=pruefstein-web
# One fixed callback instead of the originally-requested URL: Entra has no
# wildcard redirect URIs, so every protected path would otherwise need to be
# registered. All profiles — the dev realm registers http://localhost:8080/*,
# which covers this path too.
# Entra returns only what is asked for: without these, the ID token carries
# no preferred_username, name or email, and every user shows up as their
# opaque subject. Keycloak grants them by default, so this is a no-op there.
quarkus.oidc.authentication.scopes=profile,email
quarkus.oidc.authentication.redirect-path=/oidc-callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.logout.path=/oidc-logout
quarkus.oidc.logout.post-logout-path=/
quarkus.oidc.roles.role-claim-path=${pruefstein.security.role-claim-path}
quarkus.oidc.roles.source=accesstoken

# ── OIDC: api tenant — bearer token for agents ─────────────────────────
quarkus.oidc.api.application-type=service
quarkus.oidc.api.client-id=pruefstein-web
quarkus.oidc.api.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc.api.roles.role-claim-path=${pruefstein.security.role-claim-path}

# ── Agent bootstrap — served to the agent at /internal/agent-config ─────
# The agent ships with no IdP config; it asks the server it reports to.
# Keeping these next to the api tenant is the point: whatever mints the
# agent's token has to match whatever validates it.
pruefstein.agent.issuer=${quarkus.oidc.auth-server-url:}
pruefstein.agent.client-id=${quarkus.oidc.api.client-id:pruefstein-web}
pruefstein.agent.scopes=openid profile email offline_access

# ── Keycloak dev service (fixed port so the agent can share it) ─────────
quarkus.keycloak.devservices.port=8180
quarkus.keycloak.devservices.realm-path=keycloak/pruefstein-realm.json

# ── HTTP auth: protect everything; allow q/ and internal flow callbacks ─
quarkus.http.auth.permission.public.paths=/q/*,/oidc-logout,/internal/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ── RBAC ───────────────────────────────────────────────────────────────
# Name of the OIDC claim/role that grants admin access (configurable per deployment)
pruefstein.security.admin-role=admin
# Deny access to any JAX-RS endpoint that carries no security annotation — fail-safe
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# ── Project ────────────────────────────────────────────────────────────
# Where the source lives. Linked from the invitation mail and the setup
# guide, so somebody asked to run an agent on their own machine can read
# what it does first. Point it at a fork or an internal mirror if that is
# where your people should be reading.
pruefstein.project.repository-url=https://github.com/explore-de/pruefstein
# The Homebrew formula the setup instructions tell people to install. Fully
# qualified on purpose: `brew install owner/tap/formula` taps on the reader's
# behalf, so the invitation can ask for one command instead of three.
pruefstein.project.brew-formula=explore-de/pruefstein/pruefstein-agent

# ── Mail ───────────────────────────────────────────────────────────────
# Public URL used for the report links inside notification mails — the
# internal base URL is not reachable from a mail client.
pruefstein.web.base-url=http://localhost:${quarkus.http.port:8080}
quarkus.mailer.from=pruefstein@localhost

# ── LangChain4j / OpenAI ───────────────────────────────────────────────
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:dummy}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.response-format=json_object

# ── Compliance flow ────────────────────────────────────────────────────
pruefstein.compliance.remediation-days=7
# How often failed checks are sent to the model for an explanation. Off the
# request path, so the only cost of a short interval is a wake-up on an idle
# queue; the only cost of a long one is a blank explanation column for that
# much longer.
pruefstein.compliance.enrichment-interval=30s
# How long an outcome mail waits for its explanations before going out plain.
# Long enough to cover a slow model, short enough that a broken one delays the
# notification rather than replacing it with silence.
pruefstein.compliance.mail-explanation-grace=5m
pruefstein.compliance.reporting-interval-days=7
pruefstein.compliance.reminder-days-before=2
# How long before a device's reporting interval runs out we ask for a fresh
# report. Capped at one day short of the interval itself.
pruefstein.compliance.report-due-reminder-days-before=2
# Baseline checks are applied once per database and then belong to whoever
# administers them; turn off only to keep a deployment's catalog frozen.
pruefstein.compliance.seed-catalog=true
pruefstein.internal.base-url=http://localhost:${quarkus.http.port:8080}

# ── Production infrastructure ──────────────────────────────────────────
%prod.quarkus.hibernate-orm.database.generation=update

# ── Behind the TLS-terminating reverse proxy ───────────────────────────
# The container only ever sees plain HTTP on 8080. Without this, Quarkus
# builds redirect_uri as http://<container>:8080/… and Entra rejects it
# (AADSTS50011). No path prefix is in play, so enable-forwarded-prefix
# stays off. Only trustworthy while 8080 is not reachable from anywhere
# but the proxy — these headers are caller-supplied.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.enable-forwarded-host=true

# ── Production overrides (Entra ID) ───────────────────────────────────
# Required env vars: ENTRA_TENANT_ID, ENTRA_CLIENT_ID, ENTRA_CLIENT_SECRET
%prod.pruefstein.security.role-claim-path=roles
# Roles come from the ID token here, unlike Keycloak. We request only
# openid/profile/email, so Entra audiences the access token to Microsoft
# Graph and issues it in the nonce-protected format that only Graph can
# verify. Sourcing roles from it makes Quarkus verify it too, which fails
# the code flow with InvalidJwtSignatureException (401 on /oidc-callback).
# The ID token is audienced to our own client-id and carries the app roles.
%prod.quarkus.oidc.roles.source=idtoken
%prod.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%prod.quarkus.oidc.client-id=${ENTRA_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${ENTRA_CLIENT_SECRET}
%prod.quarkus.oidc.api.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%prod.quarkus.oidc.api.client-id=${ENTRA_CLIENT_ID}
# Entra needs an explicit scope on the device-code request and only issues
# refresh tokens when offline_access is asked for. Requesting our own API
# rather than the default graph audience is what makes the api tenant accept
# the access token — it needs an Application ID URI on the registration.
# The resource is named by GUID, not by the api:// URI: while the agent
# shares the web registration it is asking for a token for itself, and Entra
# allows that only in the GUID form (AADSTS90009 otherwise).
# Device code flow additionally requires a public client: set
# PRUEFSTEIN_AGENT_CLIENT_ID when the agent gets its own registration.
%prod.pruefstein.agent.issuer=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%prod.pruefstein.agent.client-id=${PRUEFSTEIN_AGENT_CLIENT_ID:${ENTRA_CLIENT_ID}}
%prod.pruefstein.agent.scopes=${ENTRA_CLIENT_ID}/.default offline_access

# ── Production mail (SMTP) ─────────────────────────────────────────────
%prod.pruefstein.web.base-url=${PRUEFSTEIN_BASE_URL:http://localhost:8080}
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.from=${MAIL_FROM:pruefstein@localhost}
%prod.quarkus.mailer.host=${SMTP_HOST:localhost}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.username=${SMTP_USERNAME:}
%prod.quarkus.mailer.password=${SMTP_PASSWORD:}

# ── Test profile: no Keycloak, no real AI key needed ───────────────────
# The engine calls back over HTTP, and tests bind the test port, not 8080.
%test.pruefstein.internal.base-url=http://localhost:${quarkus.http.test-port:8081}
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.api.tenant-enabled=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.http.auth.permission.authenticated.policy=permit
%test.quarkus.langchain4j.openai.enable-integration=false
%test.quarkus.mailer.mock=true
# Tests build the catalog they need; a seeded one would skew their counts
%test.pruefstein.compliance.seed-catalog=false
# Never fires on its own during a test run: the tests that care call the job
# directly, and one waking up mid-test would explain another test's rows.
%test.pruefstein.compliance.enrichment-interval=24h
%test.quarkus.rest-csrf.enabled=false
